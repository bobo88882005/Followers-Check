<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Followers Check</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#6c5ce7">

<link rel="apple-touch-icon" href="icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>

</head>


<body>


<div class="app">


<header>

<div class="logo">
👥
</div>

<h1>
Followers Check
</h1>

<p>
Scopri chi segui ma non ti segue
</p>

</header>



<section class="card main-card">


<label class="upload-main">

📦 Importa ZIP Instagram

<input 
type="file"
id="instagramZip"
accept=".zip">

<span>
Carica il file ZIP esportato da Instagram
</span>

</label>


<div class="divider">
oppure
</div>



<div class="file-box">

<label>

👥 Followers

<input
type="file"
id="followersFile"
accept=".txt,.html,.htm,.json">

</label>


<label>

👤 Seguiti

<input
type="file"
id="followingFile"
accept=".txt,.html,.htm,.json">

</label>

</div>



<button id="compareBtn" class="primary">

🔍 Confronta

</button>


</section>





<section class="stats">


<div class="stat">

<strong id="followersCount">
0
</strong>

<span>
Followers
</span>

</div>


<div class="stat">

<strong id="followingCount">
0
</strong>

<span>
Seguiti
</span>

</div>


<div class="stat highlight">

<strong id="notFollowCount">
0
</strong>

<span>
Non ti seguono
</span>

</div>


</section>





<section class="card results">


<input
id="search"
type="search"
placeholder="🔎 Cerca utente">


<div class="actions">


<button id="sortAZ">
A-Z
</button>


<button id="sortZA">
Z-A
</button>


<button id="copyBtn">
📋 Copia
</button>


<button id="downloadBtn">
💾 TXT
</button>


</div>



<div id="resultBox">

Nessun risultato

</div>



</section>




<button id="clearBtn" class="clear">

🗑️ Nuovo confronto

</button>



</div>





<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="app.js"></script>



<script>

if ("serviceWorker" in navigator) {

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>


</body>

</html>
